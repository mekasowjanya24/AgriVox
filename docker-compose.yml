version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: agrivox-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agrivox-ml-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=8000

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrivox-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/agrivox
      - JWT_SECRET=agrivox_super_secure_jwt_secret_key_2026_xyz
      - JWT_REFRESH_SECRET=agrivox_super_secure_jwt_refresh_key_2026_abc
      - CLIENT_URL=http://localhost:3000
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      - mongo
      - ml-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agrivox-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  mongo_data:
